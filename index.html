    <!--
      One family, Inter, at the full weight range the design actually uses.

      Inter was drawn for screen UI: it holds up at 13px in a card caption and
      at 72px in the hero, and it carries `tnum` (tabular figures), so the
      member counts, dates and district totals in the statistics rows line up in
      a column instead of jittering as the numbers change.

      The weight list is not decorative. The public pages use `font-black` and
      `font-extrabold` throughout; when only 400-700 were served the browser
      synthesised 800 and 900 by smearing the 700 outlines, which is what made
      the headings look soft and slightly blurred rather than heavy. 800 and 900
      are real cuts now.

      `preconnect` on both hosts because the stylesheet on fonts.googleapis.com
      immediately pulls files from fonts.gstatic.com; without the second hint
      that connection is opened only after the CSS has parsed.

      `display=swap` so text paints in the fallback immediately and never leaves
      a page blank while a font loads.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
