apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"
// Development builds still work before a Firebase project is supplied.
if (file("google-services.json").exists()) { apply plugin: "com.google.gms.google-services" }

/**
 * This is the configuration block to customize your React Native Android app.
 * By default you don't need to apply any configuration, just uncomment the lines you need.
 */
react {
    /* Folders */
    //   The root of your project, i.e. where "package.json" lives. Default is '../..'
    // root = file("../../")
    //   The folder where the react-native NPM package is. Default is ../../node_modules/react-native
    // reactNativeDir = file("../../node_modules/react-native")
    //   The folder where the react-native Codegen package is. Default is ../../node_modules/@react-native/codegen
    // codegenDir = file("../../node_modules/@react-native/codegen")
    //   The cli.js file which is the React Native CLI entrypoint. Default is ../../node_modules/react-native/cli.js
    // cliFile = file("../../node_modules/react-native/cli.js")

    /* Variants */
    //   The list of variants to that are debuggable. For those we're going to
    //   skip the bundling of the JS bundle and the assets. By default is just 'debug'.
    //   If you add flavors like lite, prod, etc. you'll have to list your debuggableVariants.
    // debuggableVariants = ["liteDebug", "prodDebug"]
    //
    // Empty: the debug APK ALSO gets a freshly generated JS bundle at build
    // time (into build/, never src/). With Metro connected the app still loads
    // live code; when Metro drops (USB replugged, phone slept) it falls back to
    // the bundle from this build instead of a stale hand-copied one — which is
    // how testers kept seeing the old UI after coming back to the app.
    debuggableVariants = []

    /* Bundling */
    //   A list containing the node command and its flags. Default is just 'node'.
    // nodeExecutableAndArgs = ["node"]
    //
    //   The command to run when bundling. By default is 'bundle'
    // bundleCommand = "ram-bundle"
    //
    //   The path to the CLI configuration file. Default is empty.
    // bundleConfig = file(../rn-cli.config.js)
    //
    //   The name of the generated asset file containing your JS bundle
    // bundleAssetName = "MyApplication.android.bundle"
    //
    //   The entry file for bundle generation. Default is 'index.android.js' or 'index.js'
    // entryFile = file("../js/MyApplication.android.js")
    //
    //   A list of extra flags to pass to the 'bundle' commands.
    //   See https://github.com/react-native-community/cli/blob/main/docs/commands.md#bundle
    // Bound Metro worker memory while Gradle and the development server run.
    extraPackagerArgs = ["--max-workers", "2"]

    /* Hermes Commands */
    //   The hermes compiler command to run. By default it is 'hermesc'
    // hermesCommand = "$rootDir/my-custom-hermesc/bin/hermesc"
    //
    //   The list of flags to pass to the Hermes compiler. By default is "-O", "-output-source-map"
    // hermesFlags = ["-O", "-output-source-map"]

    /* Autolinking */
    autolinkLibrariesWithApp()
}

/**
 * Set this to true to Run Proguard on Release builds to minify the Java bytecode.
 */
def enableProguardInReleaseBuilds = true

/**
 * The preferred build flavor of JavaScriptCore (JSC)
 *
 * For example, to use the international variant, you can use:
 * `def jscFlavor = io.github.react-native-community:jsc-android-intl:2026004.+`
 *
 * The international variant includes ICU i18n library and necessary data
 * allowing to use e.g. `Date.toLocaleString` and `String.localeCompare` that
 * give correct results when using with locales other than en-US. Note that
 * this variant is about 6MiB larger per architecture than default.
 */
def jscFlavor = 'io.github.react-native-community:jsc-android:2026004.+'

// Upload credentials stay in a local, ignored file; releases never use the debug key.
def releaseSigningProperties = new Properties()
def releaseSigningFile = rootProject.file('release-signing.properties')
if (releaseSigningFile.exists()) {
    releaseSigningFile.withInputStream { releaseSigningProperties.load(it) }
}
def releaseSigningReady = ['storeFile', 'storePassword', 'keyAlias', 'keyPassword'].every {
    releaseSigningProperties.getProperty(it)?.trim()
}

android {
    // ndkVersion rootProject.ext.ndkVersion  // Commented out to avoid slow NDK download
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    namespace "com.activ"
    defaultConfig {
        applicationId "in.activ.membership"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 37
        versionName "1.0.36"
    }
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        release {
            if (releaseSigningReady) {
                storeFile rootProject.file(releaseSigningProperties.getProperty('storeFile'))
                storePassword releaseSigningProperties.getProperty('storePassword')
                keyAlias releaseSigningProperties.getProperty('keyAlias')
                keyPassword releaseSigningProperties.getProperty('keyPassword')
            }
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            signingConfig signingConfigs.release
            minifyEnabled enableProguardInReleaseBuilds
            shrinkResources true
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    // The version of react-native is set by the React Native Gradle Plugin
    implementation("com.facebook.react:react-android")
    // Android 15+ sheets use the current inset/protection implementation.
    // react-native-screens otherwise pulls Material 1.12.0 transitively.
    implementation("com.google.android.material:material:1.14.0")
    // Device/account-specific availability avoids requiring a staged release
    // before Google Play actually offers it to this installation.
    implementation("com.google.android.play:app-update:2.1.0")

    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }
}

apply from: file("../../node_modules/react-native-vector-icons/fonts.gradle")

/*
 * GUARD: never ship a hand-copied React Native / Hermes library.
 *
 * A stray app/src/main/jniLibs/arm64-v8a/libhermestooling.so (a DEBUG build of
 * it) once overrode the one inside react-android, so every RELEASE build
 * paired a debug tooling library with the release Hermes VM and crashed on
 * launch with "couldn't find DSO to load: libhermestooling.so" on every 64-bit
 * phone. The engine's libraries come from the react-android / hermes-android
 * packages, matched to the build type — never from jniLibs.
 */
tasks.register('checkNoStrayReactNativeLibs') {
    doLast {
        def stray = fileTree('src/main/jniLibs').matching {
            include '**/libhermes*.so', '**/libreactnative.so', '**/libjsi.so', '**/libfbjni.so'
        }.files
        if (!stray.isEmpty()) {
            throw new GradleException("ACTIV: remove hand-copied React Native libraries from src/main/jniLibs: ${stray*.name}")
        }
    }
}
preBuild.dependsOn('checkNoStrayReactNativeLibs')

tasks.matching { it.name == 'preReleaseBuild' }.configureEach {
    doFirst {
        if (!releaseSigningReady) {
            throw new GradleException('ACTIV: configure android/release-signing.properties with the upload key before building a release.')
        }
    }
}

// Inspect the packaged DEX, so a successful R8 build cannot silently ship
// without the Java classes looked up by React Native's JNI initialization.
def releaseJniChecks = [
    assembleRelease: 'outputs/apk/release/app-release.apk',
    bundleRelease: 'outputs/bundle/release/app-release.aab'
]
releaseJniChecks.each { taskName, artifactPath ->
    tasks.matching { it.name == taskName }.configureEach {
        doLast {
            project.exec {
                commandLine 'node', rootProject.file('../scripts/verify-release-jni.cjs'),
                    layout.buildDirectory.file(artifactPath).get().asFile
            }
        }
    }
}
