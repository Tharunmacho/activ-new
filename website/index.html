<!--
  START THE LANDING PAGE'S DATA NOW, not after the bundle.

  The banner and the header cannot draw until four API reads answer, and those
  reads used to begin only once ~1 MB of JavaScript had downloaded and run —
  seconds on a phone. These few lines open the connection to the API and start
  the same four reads while the bundle is still arriving; `cmsApi.ts` takes each
  answer from `window.__ACTIV_PREFETCH__` instead of asking again. Public,
  unauthenticated reads only — the same answers any visitor gets.
-->
<script>
  (function () {
    try {
      var base = '%VITE_API_URL%';
      if (!/^https?:\/\//.test(base)) return;
      base = base.replace(/\/+$/, '');
      if (!/\/api\/v\d+$/.test(base)) base += '/api/v1';
      var origin = base.replace(/\/api\/v\d+$/, '');
      var link = document.createElement('link');
      link.rel = 'preconnect'; link.href = origin; link.crossOrigin = 'anonymous';
      document.head.appendChild(link);

      var store = window.__ACTIV_PREFETCH__ = {};
      var get = function (path) {
        store[path] = fetch(base + path, { credentials: 'omit', signal: AbortSignal.timeout(10000) })
          .then(function (r) { return r.ok ? r.json() : null; })
          .catch(function () { return null; });
      };
      var p = location.pathname.replace(/\/+$/, '') || '/';
      if (/^\/(?:cms|super-admin|state-admin|district-admin|block-admin|events-admin|admin|member|business|payment)(?:\/|$)/.test(p)) return;
      get('/cms/site');
      if (p === '/' || p === '/onboarding') {
        get('/cms/home');
        get('/cms/gallery?home=true');
        get('/cms/events?scope=public');
      }
    } catch (e) { /* the app asks for itself */ }
  })();
</script>

    else window.addEventListener('load', later);
  })();
</script>

    <noscript><img height="1" width="1" style="display:none"

    /></noscript>
    <!--
      A BRANDED FIRST FRAME. Until the app's code has arrived and run, the page
      was an empty gradient (reported on /cms as "nothing loads"). This is plain
      HTML, painted with the document itself; React replaces it on its first
      render.
    -->
    <div id="root">
      <div id="activ-startup" style="min-height:100vh;box-sizing:border-box;padding:24px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;background:#ffffff;color:#1c2e68;text-align:center;font:20px Poppins,Inter,system-ui,sans-serif">
        <img src="/logo_ACTIVian-removebg-preview.png" alt="ACTIV" width="180" style="width:180px;height:auto" />
        <div aria-hidden="true" style="width:34px;height:34px;border:3px solid #dbe4fb;border-top-color:#1c2e68;border-radius:50%;animation:activspin .8s linear infinite"></div>
        <p role="status" style="margin:0">Loading ACTIV…</p>
        <div id="activ-startup-recovery" hidden style="max-width:480px">
          <p role="alert">ACTIV is taking longer than usual to open. Check your connection, then reload this page.</p>
          <div style="display:flex;flex-wrap:wrap;justify-content:center;gap:12px">
            <button type="button" id="activ-startup-reload" style="min-height:44px;border:0;border-radius:24px;padding:12px 20px;background:#1c2e68;color:white;font:inherit;cursor:pointer">Reload page</button>
            <a href="/" style="min-height:44px;box-sizing:border-box;border:1px solid #dbe4fb;border-radius:24px;padding:12px 20px;color:#1c2e68;text-decoration:none">Go home</a>
          </div>
        </div>
        <style>@keyframes activspin{to{transform:rotate(360deg)}}</style>
      </div>
    </div>
    <script>
      // This watchdog only owns the initial HTML. It never replaces a mounted app
      // and does not reload automatically or change the signed-in session.
      (function () {
        var startup = document.getElementById('activ-startup');
        var recovery = document.getElementById('activ-startup-recovery');
        document.getElementById('activ-startup-reload').addEventListener('click', function () { location.reload(); });
        var timer = setTimeout(function () { if (startup.isConnected) recovery.hidden = false; }, 12000);
        var observer = new MutationObserver(function () {
          if (!startup.isConnected) { clearTimeout(timer); observer.disconnect(); }
        });
        observer.observe(document.getElementById('root'), { childList: true });
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
