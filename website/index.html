<!--
  START THE LANDING PAGE'S DATA NOW, not after the bundle.

  The banner and the header cannot draw until four API reads answer, and those
  reads used to begin only once ~1 MB of JavaScript had downloaded and run —
  seconds on a phone. These few lines open the connection to the API and start
  the same four reads while the bundle is still arriving; `cmsApi.ts` takes each
  answer from `window.__ACTIV_PREFETCH__` instead of asking again. Public,
  unauthenticated reads only — the same answers any visitor gets.
-->
<script>
  (function () {
    try {
      var base = '%VITE_API_URL%';
      if (!/^https?:\/\//.test(base)) return;
      base = base.replace(/\/+$/, '');
      if (!/\/api\/v\d+$/.test(base)) base += '/api/v1';
      var origin = base.replace(/\/api\/v\d+$/, '');
      var link = document.createElement('link');
      link.rel = 'preconnect'; link.href = origin; link.crossOrigin = 'anonymous';
      document.head.appendChild(link);

      var store = window.__ACTIV_PREFETCH__ = {};
      var get = function (path) {
        store[path] = fetch(base + path, { credentials: 'omit' })
          .then(function (r) { return r.ok ? r.json() : null; })
          .catch(function () { return null; });
      };
      get('/cms/site');
      var p = location.pathname.replace(/\/+$/, '') || '/';
      if (p === '/' || p === '/onboarding') {
        get('/cms/home');
        get('/cms/gallery?home=true');
        get('/cms/events?scope=public');
      }
    } catch (e) { /* the app asks for itself */ }
  })();
</script>

<!--
  THIRD-PARTY SCRIPTS WAIT UNTIL THE PAGE IS UP.

  Google Analytics (~200 KB) and the Meta Pixel (~190 KB) both downloaded in the same moment as the site's own code and fought it
  for a phone's bandwidth — none of them is needed to draw a single pixel. They
  now load once the page has finished loading and the browser is idle. Their
  queues are created immediately, so anything the app reports before then is
  kept and sent, and the page view is still counted.
-->
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
  gtag('config', 'G-KVR8RTT6G1');

  !function(f){if(f.fbq)return;var n=f.fbq=function(){n.callMethod?
  n.callMethod.apply(n,arguments):n.queue.push(arguments)};
  if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version='2.0';n.queue=[];}(window);
  fbq('init', '536417434121119');
  fbq('track', 'PageView');

  // Chat is the BotBee bot, opened by the BotBee widget script loaded here.
  (function () {
    var load = function (src) {
      var s = document.createElement('script'); s.async = true; s.src = src;
      document.head.appendChild(s);
    };
    var go = function () {
      load('https://www.googletagmanager.com/gtag/js?id=G-KVR8RTT6G1');
      load('https://connect.facebook.net/en_US/fbevents.js');
    };
    var later = function () {
      if ('requestIdleCallback' in window) window.requestIdleCallback(go, { timeout: 4000 });
      else setTimeout(go, 1500);
    };
    if (document.readyState === 'complete') later();
    else window.addEventListener('load', later);
  })();
</script>

<!-- The Meta Pixel's <noscript> fallback is at the top of <body>: an <img>
     inside <noscript> in <head> is invalid HTML and Vite refuses to serve it. -->
    <!--
      One family, POPPINS, at the full weight range the design actually uses.
    
      The weight list is not decorative. The public pages use `font-black` and
      `font-extrabold` throughout; when only 400-700 were served the browser
      synthesised 800 and 900 by smearing the 700 outlines, which is what made
      the headings look soft and slightly blurred rather than heavy. 800 and 900
      are real cuts now.

      NOTHING ELSE IS LOADED HERE, so a `fontFamily` naming a face that is not
      in this link does not fall back to Poppins — it falls through to whatever
      the generic keyword after it resolves to. One such declaration named
      Caveat and painted a note on the gallery in Comic Sans for as long as it
      stood. If a new face is genuinely wanted, it is added to THIS link first.

      POPPINS IS THE WHOLE PRODUCT — headings and body both. The association
      picked it on sight for its roundness and warmth, and asked for it
      everywhere rather than as a heading face over an Inter body, so the
      sidebar, the card copy, the form fields and the buttons are all Poppins.
      `sans` and `display` both resolve to it in `tailwind.config`.

      It carries a real 900, so `font-black` is an actual cut and not a browser
      smearing 700 or 800 outlines — which is what made the headings look soft
      under two of the faces tried before it.

      WHY SIX WEIGHTS AND NOT A RANGE: Poppins is a STATIC family on Google
      Fonts, not a variable one. Each weight is its own file, so `400;...;900`
      is six downloads where a variable face would have been one. They are all
      genuinely in use — 400 and 500 in body copy, 600 and 700 on labels and
      buttons, 800 and 900 on headings — and dropping one does not save the
      request, it makes the browser synthesise that weight from a neighbour.

      INTER STAYS IN THE STACK, directly behind Poppins, as the fallback that
      renders while Poppins is still in flight. It is no longer the body face,
      but it is a far better stand-in for one than the system UI font.

      One consequence to know about: `tnum` and `cv11` in `index.css` are INTER
      features. Poppins ships neither, so those two settings are inert now.
      `tnum` mattered because it stopped "100%" and "33%" being different widths
      in the progress figures — Poppins draws its digits at a uniform width
      anyway, so the figures still do not jitter, but it is luck rather than the
      setting doing it.

      `preconnect` on both hosts because the stylesheet on fonts.googleapis.com
      immediately pulls files from fonts.gstatic.com; without the second hint
      that connection is opened only after the CSS has parsed.

      `display=swap` so text paints in the fallback immediately and never leaves
      a page blank while a font loads.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!--
      PLAYFAIR DISPLAY IS THE ONE EXCEPTION TO THE ONE-FAMILY RULE, and it is
      scoped to a single element: the member's name on the membership
      certificate (`font-certificate` in `tailwind.config`).

      The association chose a certificate template whose whole character comes
      from a high-contrast serif holding the holder's name, with everything
      round it in a grotesque. That contrast is the design; setting the name in
      Poppins like the rest of the product produces a competent certificate and
      not that one.

      It is loaded here and NOWHERE ELSE has access to it beyond that one
      Tailwind key, because a second family available everywhere is a second
      family that turns up everywhere. 700 only — a certificate name is one
      weight.

      The lesson from the gallery note applies: a `font-family` naming a face
      this link does not request does not fall back to Poppins, it falls through
      to whatever generic keyword follows it. Adding a face means adding it HERE
      first.
    -->
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800;900&family=Inter:wght@400;500;600;700;800;900&family=Playfair+Display:wght@700&display=swap"
      rel="stylesheet"
